languageCode: en
title: Enterprise Catologue
baseURL: http://localhost:1313
enableInlineShortcodes: true
canonifyURLs: true
params:
  homepage: https://sergiohc.github.io/catalogo_empresas/
  authors: Sergio Henrique
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: colorful
  tableOfContents:
    startLevel: 2
    endLevel: 6
buildDrafts: true
buildFuture: true
enableRobotsTXT: true
metaDataFormat: yaml
disableKinds:
  - '404'
  - taxonomy
  - taxonomyTerm
  - RSS
publishDir: _gh_pages
